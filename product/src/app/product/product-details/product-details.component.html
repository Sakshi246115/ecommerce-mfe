<div class="details-page">

  <div
    class="details-container"
    *ngIf="product"
  >

    <div class="details-image">

      <img
        [src]="product.image"
        [alt]="product.name"
      />

    </div>

    <div class="details-content">

      <span class="category">
        {{ product.category }}
      </span>

      <h1>
        {{ product.name }}
      </h1>

      <div class="rating">
        ⭐ {{ product.rating }} / 5
      </div>

      <p class="description">
        {{ product.description }}
      </p>

      <div class="price">
        ₹{{ product.price }}
      </div>

      <div class="discount">
        {{ product.discount }}% OFF
      </div>

      <div class="stock">
        ✓ {{ product.stock }} items available
      </div>

      <div class="actions">

        <button
          class="back-button"
          routerLink="/"
        >
          ← Back to Home
        </button>

        <button
          class="back-button"
          routerLink="/products"
        >
          {{ detailsContent.backButton }}
        </button>

        <button
          class="cart-button"
          (click)="addToCart()"
        >
          {{ detailsContent.addToCartButton }}
        </button>

        <button
          class="back-button"
          type="button"
          (click)="patchProduct()"
          [disabled]="isUpdating"
        >
          {{
            isUpdating
              ? 'Updating...'
              : 'Test PATCH'
          }}
        </button>

      </div>

    </div>

  </div>

  <div
    class="not-found"
    *ngIf="!product"
  >

    <div class="icon">
      🔍
    </div>

    <h2>
      {{ detailsContent.notFoundTitle }}
    </h2>

    <p>
      {{ detailsContent.notFoundDescription }}
    </p>

    <button
      routerLink="/products"
    >
      {{ detailsContent.backButton }}
    </button>

  </div>

</div>
